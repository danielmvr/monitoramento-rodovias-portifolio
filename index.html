<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Monitoramento de Rodovias</title>
  <meta name="description" content="Painel de monitoramento de rodovias (demo de portfolio com dados sinteticos), rodando Streamlit no navegador via stlite." />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@stlite/browser@1.12.0/build/stlite.css" />
  <style>
    html, body { margin: 0; background: #161a2e; color: #e9ecf6; font-family: "Segoe UI", system-ui, Arial, sans-serif; }
    #carregando { max-width: 560px; margin: 18vh auto 0; padding: 0 16px; text-align: center; line-height: 1.5; }
    #carregando b { color: #f7c01a; }
  </style>
</head>
<body>
  <div id="root">
    <div id="carregando">
      <p><b>Monitoramento de Rodovias</b></p>
      <p>Carregando o Python no navegador (stlite). A primeira abertura leva de 15 a 30 segundos.</p>
      <p>Demo de portfolio: noticias reais do Google Noticias; linhas, frota e atrasos sinteticos.</p>
    </div>
  </div>
  <script type="module">
    import { mount } from "https://cdn.jsdelivr.net/npm/@stlite/browser@1.12.0/build/stlite.js";

    // Noticias reais: a coleta do GitHub Actions (.github/workflows/noticias.yml)
    // grava noticias.json no branch 'dados-noticias'. Se nao der para ler, o
    // painel usa o arquivo sintetico do repositorio (data/noticias.json).
    let noticias = { url: "./data/noticias.json" };
    const dono = location.hostname.split(".")[0];
    const repo = location.pathname.split("/").filter(Boolean)[0];
    if (location.hostname.endsWith(".github.io") && repo) {
      try {
        const r = await fetch(
          `https://raw.githubusercontent.com/${dono}/${repo}/dados-noticias/noticias.json?t=${Date.now()}`,
          { cache: "no-store" });
        if (r.ok) {
          const texto = await r.text();
          JSON.parse(texto);
          noticias = { data: texto };
        }
      } catch (e) {
        console.warn("Noticias ao vivo indisponiveis; usando o arquivo do repositorio.", e);
      }
    }

    mount(
      {
        requirements: ["folium", "pyyaml", "jinja2"],
        entrypoint: "app.py",
        files: {
        "app.py": { url: "./app.py" },
        "core.py": { url: "./core.py" },
        "config.yaml": { url: "./config.yaml" },
        "monitor/__init__.py": { url: "./monitor/__init__.py" },
        "monitor/atrasos_page.py": { url: "./monitor/atrasos_page.py" },
        "monitor/coleta.py": { url: "./monitor/coleta.py" },
        "monitor/config.py": { url: "./monitor/config.py" },
        "monitor/frota.py": { url: "./monitor/frota.py" },
        "monitor/geocode.py": { url: "./monitor/geocode.py" },
        "monitor/mapa.py": { url: "./monitor/mapa.py" },
        "monitor/pipeline.py": { url: "./monitor/pipeline.py" },
        "monitor/processa.py": { url: "./monitor/processa.py" },
        "data/atrasos.txt": { url: "./data/atrasos.txt" },
        "data/cidades.json": { url: "./data/cidades.json" },
        "data/coords_builtin.json": { url: "./data/coords_builtin.json" },
        "data/gps_ultimas_posicoes.csv": { url: "./data/gps_ultimas_posicoes.csv" },
        "data/linhas_rotas.json": { url: "./data/linhas_rotas.json" },
        "data/meta.json": { url: "./data/meta.json" },
        "data/noticias.json": noticias
        },
        streamlitConfig: {
          "theme.base": "dark",
          "theme.primaryColor": "#f7c01a",
          "theme.backgroundColor": "#161a2e",
          "theme.secondaryBackgroundColor": "#222743",
          "theme.textColor": "#e9ecf6",
          "client.toolbarMode": "viewer"
        }
      },
      document.getElementById("root")
    );
  </script>
</body>
</html>
