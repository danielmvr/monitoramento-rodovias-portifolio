# ==========================================================================
# Monitoramento de Rodovias (versao de portfolio)
# Todos os dados lidos pelo painel sao sinteticos, gerados por
# scripts/gerar_dados_sinteticos.py (seed fixa).
# ==========================================================================

app:
  titulo: "Monitoramento de Rodovias"
  janela_dias: 7            # janela de busca de noticias (dias para tras)
  periodo_default: 3        # filtro de periodo (dias) padrao no painel
  max_por_consulta: 8       # maximo de noticias por rodovia/consulta
  linhas_raio_km: 40        # raio (km) p/ uma linha ser considerada afetada
  buscar_hubs: true         # tambem busca noticias por cidades-hub
  fetch_artigo: false
  idioma_news: "pt-BR"
  pais_news: "BR"

# Arquivos sinteticos lidos pelo painel (caminhos relativos a raiz).
dados:
  meta: "data/meta.json"
  noticias: "data/noticias.json"
  gps: "data/gps_ultimas_posicoes.csv"
  atrasos: "data/atrasos.txt"

# Regra de atrasos (core.py) e camada de carros no mapa.
atrasos:
  limite_min: 60
  frescor_min: 180
frota:
  janela_min: 60
  raio_km: 15
  mostrar: true

# Palavras que caracterizam um "problema" na via. A noticia so e mantida se
# o titulo/resumo contiver pelo menos uma destas E uma referencia a rodovia.
palavras_problema:
  - interdicao
  - interditada
  - interditado
  - bloqueio
  - bloqueada
  - acidente
  - colisao
  - capotamento
  - tombamento
  - congestionamento
  - transito
  - lentidao
  - deslizamento
  - queda de barreira
  - alagamento
  - obras
  - protesto
  - manifestacao
  - neblina
  - feridos

# --------------------------------------------------------------------------
